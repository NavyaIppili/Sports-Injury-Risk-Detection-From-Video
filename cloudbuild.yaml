# Google Cloud Build configuration for Cloud Run deployment
# This file defines how to build and deploy the application to Cloud Run

steps:
  # Build backend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sports-injury-backend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sports-injury-backend:$SHORT_SHA'
      - '-f'
      - 'backend/Dockerfile.cloud'
      - '.'

  # Build frontend image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sports-injury-frontend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/sports-injury-frontend:$SHORT_SHA'
      - '-f'
      - 'frontend/Dockerfile.cloud'
      - 'frontend'

  # Push backend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sports-injury-backend:latest'

  # Push frontend image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/sports-injury-frontend:latest'

  # Deploy backend to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-backend'
    args:
      - 'run'
      - '--filename=.gcloud/backend-cloudrun.yaml'
      - '--location=us-central1'

  # Deploy frontend to Cloud Run (with backend URL)
  - name: 'gcr.io/cloud-builders/gke-deploy'
    id: 'deploy-frontend'
    args:
      - 'run'
      - '--filename=.gcloud/frontend-cloudrun.yaml'
      - '--location=us-central1'

images:
  - 'gcr.io/$PROJECT_ID/sports-injury-backend:latest'
  - 'gcr.io/$PROJECT_ID/sports-injury-frontend:latest'

timeout: '1800s'
